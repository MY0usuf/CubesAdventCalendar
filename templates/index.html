<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Advent!</title>
	<link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,700" rel="stylesheet" />
	<link rel="stylesheet" type="text/css" href="static/css/normalize.css" />
	<link rel="stylesheet" type="text/css" href="static/css/common.css" />
	<link rel="stylesheet" type="text/css" href="static/css/style1.css" />
    <style>
        body {
            background-color: #fff8e1; /* Light yellowish background */
            background-image: url('{{ url_for('static', filename='images/forest.gif') }}'); /* Optional background image */
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9); /* Slightly transparent white */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: flex;
        }

        h1 {
            color: #ffb300; /* Sunflower yellow */
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 1px 1px #fdd835;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #757575;
        }

        input[type="text"],
        input[type="password"] {
            width: calc(100% - 22px);
            padding: 10px;
            border: 2px solid #ffe082; /* Light sunflower yellow border */
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffca28; /* Slightly darker yellow on focus */
            box-shadow: 0 0 5px rgba(255, 202, 40, 0.5);
        }

        button[type="submit"] {
            background-color: #fdd835; /* Bright sunflower yellow button */
            color: #333;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #ffeb3b; /* Slightly lighter yellow on hover */
        }

        .error {
            color: #d32f2f;
            margin-top: 10px;
        }

        .sunflower-icon {
            font-size: 2em;
            color: #fbc02d;
            margin-bottom: 10px;
            text-shadow: 1px 1px #f9a825;
        }
    </style>
</head>
<body class="h-full">
	<div class="login-container">
        <div class="sunflower-icon">🌻</div>
        <h1 class="countdown" id="demo"></h1>
		<p style="color: #757575;">Till your Special Day</p>
		<p class="explanation">Come back each day leading up to your birthday on April 12th to unlock a little digital surprise just for you!</p>
        <form method="POST">
            <button type="submit">Unlock your daily surprise!</button>
        </form>
    </div>
</body>
</html>
<script>
			// Set the date we're counting down to
			var countDownDate = new Date("2025-04-11T18:30:00Z").getTime();

// Update the count down every 1 second
var x = setInterval(function() {

// Get today's date and time
var now = new Date().getTime();

// Find the distance between now and the count down date
var distance = countDownDate - now;

// Time calculations for days, hours, minutes and seconds
var days = Math.floor(distance / (1000 * 60 * 60 * 24));
var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
var seconds = Math.floor((distance % (1000 * 60)) / 1000);

// Display the result in the element with id="demo"
document.getElementById("demo").innerHTML = days + "d " + hours + "h "
+ minutes + "m " + seconds + "s ";

// If the count down is finished, write some text
if (distance < 0) {
	clearInterval(x);
	document.getElementById("demo").innerHTML = "HAPPY BIRTHDAY";
}
}, 1000);
</script>
