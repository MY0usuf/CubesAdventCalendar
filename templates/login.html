<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Advent!</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #fff8e1; /* Light yellowish background */
            background-image: url('{{ url_for('static', filename='images/forest.gif') }}'); /* Optional background image */
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9); /* Slightly transparent white */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #ffb300; /* Sunflower yellow */
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 1px 1px #fdd835;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #757575;
        }

        input[type="text"],
        input[type="password"] {
            width: calc(100% - 22px);
            padding: 10px;
            border: 2px solid #ffe082; /* Light sunflower yellow border */
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffca28; /* Slightly darker yellow on focus */
            box-shadow: 0 0 5px rgba(255, 202, 40, 0.5);
        }

        button[type="submit"] {
            background-color: #fdd835; /* Bright sunflower yellow button */
            color: #333;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #ffeb3b; /* Slightly lighter yellow on hover */
        }

        .error {
            color: #d32f2f;
            margin-top: 10px;
        }

        .sunflower-icon {
            font-size: 2em;
            color: #fbc02d;
            margin-bottom: 10px;
            text-shadow: 1px 1px #f9a825;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="sunflower-icon">🌻</div>
        <h1>Happy Birthday! 🎉</h1>
        <p style="color: #757575;">Unlock your daily surprise!</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Let's Go!</button>
        </form>
    </div>
</body>
</html>
